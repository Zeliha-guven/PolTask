# scripts/check.conf — PolTask'in tek doğrulama sözleşmesinin adımları (./scripts/check).
# Bootstrap 2026-11-01 (adoption). Biçim: scripts/check.conf.example.
#
# Profiller: [fast] etiketli adımlar iç döngüde (./scripts/check --fast) çalışır; etiketsizler yalnızca
# tam profilde. Kanıt yalnızca tam yeşildir (docs/testing.md, Two speeds, one contract).
# Bugün aktif: compile + lint + test-unit (hızlı) ve test-integration (yalnızca tam) — spec 0001.
# Testler seçiciyle bölünür (-m "not integration" / -m integration), listeyle değil.
# Web adımları spec 0002 ile açıldı.
#
# resource hygiene: ruff/pytest/compileall run once and exit; no daemon, no server
# resource hygiene (data): pytest testleri test başına geçici SQLite kullanır (tmp_path); data/ okunmaz —
# tests/conftest.py varsayılan yolu yönlendirir, storage pytest altında gerçek data/poltask.db'yi reddeder.
# Web adımları: vitest "run" (watch değil), vite build tek seferlik; dev server check'te yok.

requires compile: python -c "import sys; sys.exit(0 if sys.version_info[:2] == (3, 12) else 1)"
requires lint: python -m ruff --version
requires test-unit: python -m pytest --version
requires test-integration: python -m pytest --version

compile [fast]: python -m compileall -q app.py importer.py poltask tests
lint [fast]: python -m ruff check .
test-unit [fast]: python -m pytest -q -m "not integration"
test-integration: python -m pytest -q -m integration

# --- web (spec 0002) — web/node_modules önceden `cd web && npm ci` ile kurulmuş olmalı; check npm ci çalıştırmaz.
# resource hygiene (web): eslint/tsc/vitest run/vite build tek seferlik çalışıp çıkar; watch ve dev server yok.
requires web-lint: node -e "process.exit(+process.versions.node.split('.')[0] >= 20 ? 0 : 1)"
requires web-test: node -e "process.exit(+process.versions.node.split('.')[0] >= 20 ? 0 : 1)"
requires web-build: node -e "process.exit(+process.versions.node.split('.')[0] >= 20 ? 0 : 1)"

web-lint [fast]: npm --prefix web run lint
web-test: npm --prefix web test
web-build: npm --prefix web run build
