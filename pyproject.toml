# Yalnızca araç yapılandırması (ruff + pytest). Paket tanımı değildir.

[tool.ruff]
target-version = "py312"
line-length = 120
# .claude: yerel ajan worktree kopyaları (repo içeriği değil)
extend-exclude = [
    ".claude",
    "web/node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: api/storage/integrations testleri (tam profil; hızlı profil -m 'not integration' çalıştırır)",
]
